<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="512" height="512" rx="115" fill="#8B1538"/>
  
  <!-- Иконка "Новинка" - звезда с буквой Н -->
  <circle cx="256" cy="256" r="180" fill="white" opacity="0.95"/>
  
  <!-- Буква Н -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="#8B1538" text-anchor="middle">Н</text>
  
  <!-- Звездочка "новинка" -->
  <circle cx="380" cy="150" r="40" fill="#FFD700"/>
  <text x="380" y="165" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#8B1538" text-anchor="middle">★</text>
</svg>
